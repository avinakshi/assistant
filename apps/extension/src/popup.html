<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Interview Copilot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>Interview Copilot</strong>
      <span id="status"></span>
    </header>

    <section id="signin-section" hidden>
      <div class="signin-hint">
        Not signed in. Click below to open the web app and sign in \u2014 tokens come back
        to the extension automatically.
      </div>
      <label>
        Web URL
        <input id="web-url" type="url" placeholder="http://localhost:3000" />
      </label>
      <div class="config-actions">
        <button id="sign-in" type="button">Sign in</button>
      </div>
    </section>

    <section id="config-section">
      <details>
        <summary>Config</summary>
        <label>
          API URL
          <input id="api-url" type="url" placeholder="http://localhost:3001" />
        </label>
        <label>
          Session JSON (paste the whole blob from /app/settings \u2192 "Chrome extension session")
          <textarea
            id="bundle"
            rows="4"
            placeholder='{ "accessToken": "...", "refreshToken": "...", "supabaseUrl": "...", "supabaseAnonKey": "...", "expiresAt": 1234567890 }'
          ></textarea>
        </label>
        <div class="config-actions">
          <button id="save-config" type="button">Save</button>
          <button id="clear-session" type="button" class="secondary">Clear session</button>
        </div>
        <div id="config-message"></div>
      </details>
    </section>

    <section id="problem-section" hidden>
      <div class="problem-header">
        <span id="problem-title"></span>
        <span id="problem-difficulty" class="pill"></span>
      </div>
      <p id="problem-slug"></p>
    </section>

    <button id="get-solution" type="button" disabled>Get solution</button>

    <section id="answer-section" hidden>
      <div id="answer-meta"></div>
      <pre id="answer-text"></pre>
    </section>

    <section id="error-section" hidden>
      <div id="error-text"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
