name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  lint-typecheck-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup@v4 reads the version from root package.json's packageManager field.
      # Passing `version:` here when packageManager is set throws
      # "Multiple versions of pnpm are specified — remove the `version` field".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # TODO(phase-11-polish): migrate root .eslintrc.cjs to flat `eslint.config.mjs` and
      # re-enable. ESLint 9 dropped the legacy format; typecheck already catches the
      # correctness issues in the meantime.
      # - name: Lint
      #   run: pnpm lint

      - name: Test (unit + integration, excluding audio-core)
        run: pnpm -r --filter '!@repo/audio-core' test
        env:
          WS_SHARED_SECRET: ci-shared-secret-0123456789abcdef
          NODE_ENV: test
          LOG_LEVEL: error

  rust-audio-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/audio-core

      - name: Rust fmt
        working-directory: packages/audio-core
        run: cargo fmt --check

      # Clippy: only DENY the categories whose violations are bugs (correctness / suspicious /
       # perf). Style + pedantic stay as warn — we opted into pedantic in Cargo.toml as an
       # advisory nudge, not a CI gate. Keeps the signal high-signal vs nit-blocking.
      - name: Rust clippy
        working-directory: packages/audio-core
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

      - name: Rust unit tests
        working-directory: packages/audio-core
        run: cargo test
