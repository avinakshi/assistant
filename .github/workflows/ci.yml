name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  lint-typecheck-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit + integration, excluding audio-core)
        run: pnpm -r --filter '!@repo/audio-core' test
        env:
          WS_SHARED_SECRET: ci-shared-secret-0123456789abcdef
          NODE_ENV: test
          LOG_LEVEL: error

  rust-audio-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/audio-core

      - name: Rust fmt
        working-directory: packages/audio-core
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: packages/audio-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: packages/audio-core
        run: cargo test
